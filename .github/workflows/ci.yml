name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download and verify Gitleaks
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" | sha256sum --check --status
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks

      - name: Scan Git history for secrets
        run: '"${{ runner.temp }}/gitleaks" git . --no-banner --redact'

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile scripts and tests
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run checker smoke test
        run: python scripts/check_mp.py tests/fixtures/valid.md

      - name: Run renderer smoke test
        run: >-
          python scripts/apply_template.py tests/fixtures/valid.md
          --template policy-whitepaper
          --output "${{ runner.temp }}/wechat-mp-output.html"

      - name: Run unified CLI doctor
        run: python scripts/wechat_mp.py doctor

      - name: Validate all templates
        run: python scripts/wechat_mp.py validate-template

      - name: Run unified build smoke test
        run: >-
          python scripts/wechat_mp.py build tests/fixtures/valid.md
          --template policy-whitepaper
          --output "${{ runner.temp }}/wechat-mp-build.html"

      - name: Run tracked-files-only install smoke test
        shell: bash
        run: |
          install_dir="${RUNNER_TEMP}/wechat-mp-writer"
          mkdir -p "${install_dir}"
          git archive HEAD | tar -x -C "${install_dir}"
          cd "${install_dir}"
          python scripts/wechat_mp.py doctor
          python scripts/wechat_mp.py build \
            templates/long-term-care-policy/sample.md \
            --template long-term-care-policy \
            --output "${RUNNER_TEMP}/long-term-care-policy.html"
