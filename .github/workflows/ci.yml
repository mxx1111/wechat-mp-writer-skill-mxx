name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile scripts and tests
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run checker smoke test
        run: python scripts/check_mp.py tests/fixtures/valid.md

      - name: Run renderer smoke test
        run: >-
          python scripts/apply_template.py tests/fixtures/valid.md
          --template policy-whitepaper
          --output "${{ runner.temp }}/wechat-mp-output.html"
