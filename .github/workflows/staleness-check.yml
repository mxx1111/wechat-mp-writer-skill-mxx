name: Platform Limits Staleness & CI Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 每周一 UTC 03:00 定时执行检查
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-limits-staleness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run Staleness Check
        id: staleness
        run: |
          # 检查并输出结果到 GitHub Actions Summary
          python3 scripts/check_staleness.py --json > staleness_result.json

      - name: Enforce Verified Limits on Push and Pull Request
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python3 scripts/check_staleness.py --fail-enforced

      - name: Create or Update GitHub Issue on Stale Limits (Scheduled run only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('staleness_result.json', 'utf8'));

            if (data.staleCount === 0) {
              console.log('No stale limits found. Skipping notification.');
              return;
            }

            const title = `⚠️ [Platform Limits] 发现 ${data.staleCount} 项平台限制规则已过期，需重新核对`;
            let body = `## 📋 WeChat MP 平台限制规则陈旧度报警\n\n`;
            body += `- **判定阈值**: \`${data.thresholdDays}\` 天\n`;
            body += `- **依据**: ${data.rationale}\n`;
            body += `- **过期项统计**: 总计 ${data.staleCount} 项（其中强制拦截 ${data.criticalCount} 项，提示项 ${data.warningCount} 项）\n\n`;
            body += `### 详细过期列表\n\n`;
            body += `| 级别 | 限制项 | 强制拦截 | 最后核实日期 | 已过去 | 核对来源 |\n`;
            body += `| :--- | :--- | :---: | :---: | :---: | :--- |\n`;

            for (const r of data.reports) {
              if (!r.is_stale && !r.is_invalid) continue;
              const lvl = r.severity === 'critical' ? '🚨 强制拦截/高危' : '⚠️ 提示项';
              const enforce = r.enforce ? '✅ 是' : '❌ 否';
              const dt = r.last_verified || '*(缺失)*';
              const age = r.age_days !== null ? `${r.age_days} 天` : '*(未知)*';
              const src = r.source_url ? `[${r.source_url}](${r.source_url})` : '*(无)*';
              body += `| ${lvl} | \`${r.target}\`<br><small>${r.name}</small> | ${enforce} | ${dt} | ${age} | ${src} |\n`;
            }

            body += `\n\n> 💡 **处理指引**：请打开 [references/platform-limits.json](references/platform-limits.json)，对照上述来源核对微信官方最新规则后更新 \`lastVerified\` 与具体数值。`;

            // 搜索是否已有未关闭的陈旧度告警 issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]'
            });

            const existing = issues.data.find(i => i.title.includes('[Platform Limits]'));
            if (existing) {
              console.log(`Updating existing issue #${existing.number}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `🔄 **定时检查更新**：\n\n${body}`
              });
            } else {
              console.log('Creating new issue for stale limits notification');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['documentation']
              });
            }
